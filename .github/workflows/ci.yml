name: CI

# 只允许手动执行：每次运行都会构建一个签名的 APK，并自动创建/更新对应频道的
# GitHub Release（资产直接是 APK，不再包 zip）。
# 版本号取自 src/CarpeLines.KMP/version.properties；发布 tag 用 HEAD 提交时间生成，
# versionName 和 APK 名用提交数，versionCode 的基数也是提交数，构建哈希是短 hash。
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Release channel
        type: choice
        required: true
        default: alpha
        options:
          - alpha
          - beta
          - stable

# 同一频道不并发发布；正在发布时取消会留下半成品 Release。
concurrency:
  group: ci-${{ inputs.channel }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish ${{ inputs.channel }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: src/CarpeLines.KMP

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # 构建号来自完整提交数，浅克隆会截断。
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 旧版默认值为 "tools platform-tools"，而 tools 已从 SDK 仓库移除，
          # 会导致 sdkmanager 报 "Failed to find package 'tools'"。
          # 此处只装 platform-tools，android-37 平台与 build-tools 由 AGP 自动下载。
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Resolve version metadata
        run: |
          set -euo pipefail
          channel="${{ inputs.channel }}"
          version="$(sed -n 's/^version=//p' version.properties | tr -d '[:space:]')"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version.properties must define version=<major>.<minor>.<patch> (got '$version')"
            exit 1
          fi
          build="$(git rev-list --count HEAD)"
          hash="$(git rev-parse --short=7 HEAD)"
          channel_label="${channel^}"
          # tag 用 HEAD 的提交时间（UTC）：定长，GitHub 的字符串排序等价于时间序。
          # APK 名和 versionName 仍用提交数，更新检查从资产名读取它。
          stamp="$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y%m%d.%H%M)"
          version_name="${version}-${channel}.${build}"
          tag="v${version}-${channel}.${stamp}"
          apk_name="CarpeLines-${version_name}-universal.apk"

          {
            echo "VERSION=$version"
            echo "CHANNEL_LABEL=$channel_label"
            echo "BUILD=$build"
            echo "HASH=$hash"
            echo "VERSION_NAME=$version_name"
            echo "TAG=$tag"
            echo "APK_NAME=$apk_name"
          } >> "$GITHUB_ENV"
          echo "Publishing $tag"

      - name: Restore release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_STORE_PASSWORD: ${{ secrets.KEYSTORE_STORE_PASSWORD }}
          KEYSTORE_KEY_ALIAS: ${{ secrets.KEYSTORE_KEY_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_STORE_PASSWORD KEYSTORE_KEY_ALIAS KEYSTORE_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing repository secret $name"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_STORE_PASSWORD"
            echo "keyAlias=$KEYSTORE_KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_KEY_PASSWORD"
          } > keystore.properties

      - name: Lyrics engine tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Assemble signed release APK
        run: >-
          ./gradlew :app:assembleRelease
          -Pcarpelines.channel=${{ inputs.channel }}
          -Pcarpelines.enableAbiSplits=false
          -PAPP_BUILD_TIME_EPOCH=$(date +%s)
          --stacktrace

      - name: Collect APK
        run: |
          set -euo pipefail
          apk="$(find app/build/outputs/apk/release -name '*.apk' -print -quit)"
          if [ -z "$apk" ]; then
            echo "::error::assembleRelease produced no APK"
            exit 1
          fi
          # 未签名的产物会带 -unsigned；发布流程不接受它。
          if [ "$(basename "$apk")" != "$APK_NAME" ]; then
            echo "::error::Unexpected APK name '$(basename "$apk")', expected '$APK_NAME' (is signing configured?)"
            exit 1
          fi
          cp "$apk" "$RUNNER_TEMP/$APK_NAME"
          echo "Collected $apk"

      - name: Generate changelog
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          {
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Channel | \`${{ inputs.channel }}\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Build | \`$BUILD\` |"
            echo "| Commit | [\`$HASH\`](https://github.com/${{ github.repository }}/commit/$GITHUB_SHA) |"
            echo
          } > "$notes"
          bash "$GITHUB_WORKSPACE/.github/scripts/generate-changelog.sh" \
            "${{ inputs.channel }}" "$TAG" "$notes"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          apk="$RUNNER_TEMP/$APK_NAME"
          title="CarpeLines $VERSION $CHANNEL_LABEL $BUILD"
          prerelease_flag="--prerelease"
          if [ "${{ inputs.channel }}" = "stable" ]; then
            prerelease_flag="--latest"
          fi

          # 同一提交重跑时更新已有 Release，避免 tag 冲突，也不产生重复 Release。
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk" --clobber
            gh release edit "$TAG" \
              --title "$title" \
              --notes-file "$notes" \
              $prerelease_flag
          else
            target_args=(--target "$GITHUB_SHA")
            if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null 2>&1; then
              target_args=()
            fi
            gh release create "$TAG" "$apk" \
              "${target_args[@]}" \
              --title "$title" \
              --notes-file "$notes" \
              $prerelease_flag
          fi
          echo "Published https://github.com/${{ github.repository }}/releases/tag/$TAG"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            src/CarpeLines.KMP/**/build/reports/tests/
            src/CarpeLines.KMP/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
