name: CI

# 手动触发：提交和 PR 不再自动跑构建，需要时在 Actions 页面点 "Run workflow"，
# 或用 gh workflow run CI。
on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: src/CarpeLines.KMP

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Version name/code are derived from tags and commit count, which a shallow
          # clone would truncate.
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # 旧版默认值为 "tools platform-tools"，而 tools 已从 SDK 仓库移除，
          # 会导致 sdkmanager 报 "Failed to find package 'tools'"。
          # 此处只装 platform-tools，android-37 平台与 build-tools 由 AGP 自动下载。
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Lyrics engine tests
        run: ./gradlew :shared:jvmTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug -Pcarpelines.enableAbiSplits=false --stacktrace

      - name: App unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            src/CarpeLines.KMP/**/build/reports/tests/
            src/CarpeLines.KMP/**/build/test-results/
          if-no-files-found: ignore
          retention-days: 7
