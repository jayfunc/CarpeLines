<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 196" width="280" height="196" role="img" aria-label="CarpeLines">
  <title>CarpeLines — vertical lockup</title>
  <style>
    .wordmark { fill: #1C1917 }
    @media (prefers-color-scheme: dark) { .wordmark { fill: #F7F2E9 } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF6EA"/>
      <stop offset="1" stop-color="#FFE4C6"/>
    </linearGradient>
    <clipPath id="squircle">
      <rect width="108" height="108" rx="30"/>
    </clipPath>
  </defs>

  <g transform="translate(86 20)">
    <g clip-path="url(#squircle)">
      <rect width="108" height="108" fill="url(#bg)"/>
    </g>
    <rect x="25" y="34" width="50" height="8" rx="4" fill="#D9480F"/>
    <rect x="25" y="50" width="26" height="8" rx="4" fill="#D9480F"/>
    <rect x="69" y="50" width="15" height="8" rx="4" fill="#8A7663"/>
    <rect x="25" y="66" width="30" height="8" rx="4" fill="#8A7663"/>
    <circle cx="60" cy="54" r="7" fill="#1C1917"/>
  </g>

  <text x="140" y="178" text-anchor="middle" class="wordmark"
        font-family="RoundedSans, 'Google Sans', 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif"
        font-size="36" font-weight="700" letter-spacing="-0.8">CarpeLines</text>
</svg>
